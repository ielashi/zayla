# Zayla with Docker Compose. See "Install with Docker" in the README.
#
#   mkdir library        # create it yourself, so it's owned by you, not root
#   docker compose up -d
#   docker compose logs zayla   # the Setup code is printed here on first start
services:
  zayla:
    image: ghcr.io/ielashi/zayla:latest # or pin a release, e.g. :0.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # The Library: plain files you can browse and back up. Copy this folder
      # to back it up; there is no database to dump.
      - ./library:/data
    # The image runs as uid 1000. If the Library folder belongs to someone
    # else, run as its owner instead (`id -u` and `id -g` print yours):
    # user: "1001:1001"
    # Passkeys need the address you open Zayla at, behind HTTPS. Without it,
    # you sign in with a password.
    # environment:
    #   ZAYLA_URL: https://docs.example.com
